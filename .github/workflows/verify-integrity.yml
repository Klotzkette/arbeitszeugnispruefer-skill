name: Verify repository integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Install deterministic PDF build dependencies
        run: python3 -m pip install --requirement requirements-build.txt

      - name: Rebuild test artifacts twice
        run: python3 scripts/build_generated_testakten.py --verify-reproducible

      - name: Run repository integrity checks
        run: python3 scripts/check_release_integrity.py

      - name: Confirm checks leave the worktree clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            exit 1
          fi
